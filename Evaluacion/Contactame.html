<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<title>Contacto</title>

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Segoe UI', Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
    background: linear-gradient(135deg, #f4f7f6 0%, #e2e8f0 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .form-container {
    background: #ffffff;
    width: 100%;
    max-width: 520px;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
  }

  h2 {
    text-align: center;
    color: #1e293b;
    font-size: 1.8rem;
    margin-bottom: 8px;
  }

  p.subtitle {
    text-align: center;
    color: #64748b;
    font-size: 0.95rem;
    margin-bottom: 28px;
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .input-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  label {
    font-size: 0.88rem;
    font-weight: 600;
    color: #334155;
  }

  input, textarea {
    width: 100%;
    padding: 12px 16px;
    border: 1.5px solid #cbd5e1;
    border-radius: 8px;
    font-size: 0.98rem;
    font-family: inherit;
    color: #0f172a;
    background-color: #f8fafc;
    transition: all 0.25s ease;
    outline: none;
  }

  input:focus, textarea:focus {
    border-color: #0078d4;
    background-color: #ffffff;
    box-shadow: 0 0 0 4px rgba(0, 120, 212, 0.15);
  }

  textarea {
    resize: vertical;
    min-height: 130px;
  }

  button {
    background: linear-gradient(135deg, #0078d4 0%, #005ea6 100%);
    color: #ffffff;
    border: none;
    padding: 14px;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s ease;
    box-shadow: 0 4px 12px rgba(0, 120, 212, 0.3);
    margin-top: 8px;
  }

  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(0, 120, 212, 0.4);
  }

  button:active {
    transform: translateY(0);
    box-shadow: 0 2px 8px rgba(0, 120, 212, 0.3);
  }

.nav-capsulas {
    background-color: #0078d4; /* Azul oscuro del fondo */
    padding: 20px;
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 12px;
    padding: 20px;
    border-radius: 10px;
    flex-wrap: wrap;
}

header {
    width: 100%;
    position: absolute;
    top: 0;
    left: 0;
    margin-top: 8px;
}
.nav-capsulas a {
    background-color: rgba(255, 255, 255, 0.18);
    color: #ffffff;
    text-decoration: none;
    padding: 9px 22px;
    border-radius: 50px;
    font-family: 'Segoe UI', Arial, sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: all 0.25s ease;
}

.nav-capsulas a:hover {
    background-color: rgba(137, 33, 33, 0.3);
    transform: translateY(-5px);
}


</style>
</head>

<body>

  <div class="form-container">
    <h2>Contáctame</h2>
    <p class="subtitle">Envíame un mensaje y te responderé lo antes posible.</p>

    <form action="https://api.web3forms.com/submit" method="POST">
      <input type="hidden" name="access_key" value="PEGA TU APIKEY AQUÍ">
      <input type="hidden" name="subject" value="Nuevo mensaje desde la pagina de Ronald">

      <div class="input-group">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
      </div>

      <div class="input-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" placeholder="tu@email.com" required>
      </div>

      <div class="input-group">
        <label for="mensaje">Mensaje</label>
        <textarea id="mensaje" name="mensaje" placeholder="Escribe tu mensaje..." required></textarea>
      </div>

      <button type="submit">Enviar mensaje</button>
    </form>
        <header>
        <nav class="nav-capsulas">
          <a href="index .html"><i class="fa-solid fa-house"></i> Inicio</a>
          <a href="galeria .html"><i class="fa-solid fa-images"></i> Galería</a>
          <a href="sobre .html"><i class="fa-solid fa-envelope"></i> Sobre mi</a>
          <a href="contacto .html"><i class="fa-solid fa-envelope"></i> contacto</a>
          <a href="Proyectos.html"><i class="fa-solid fa-envelope"></i> Proyectos</a>

        </nav>
        
    </header>
  </div>

</body>
</html>
