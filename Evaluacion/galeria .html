    <title>Galería Multimedia | Jesus Huaman Purihuaman</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #eef2f7 0%, #dbeafe 100%);
            color: #1e293b;
            min-height: 100vh;
            padding: 30px 15px;
        }

        nav {
            background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
            padding: 14px 20px;
            text-align: center;
            border-radius: 12px;
            margin: 0 auto 30px auto;
            max-width: 900px;
            box-shadow: 0 4px 15px rgba(30, 58, 138, 0.2);
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            padding: 8px 20px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
            font-size: 0.95rem;
            text-transform: capitalize;
        }

        nav a:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .galeria {
            text-align: center;
            background-color: #ffffff;
            padding: 35px 25px;
            border-radius: 16px;
            max-width: 900px;
            margin: 0 auto;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
        }

        h2 {
            text-align: center;
            color: #1e3a8a;
            font-size: 1.6rem;
            margin: 10px 0 20px 0;
            font-weight: 700;
        }

        .fila {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin: 20px 0;
        }

        .foto1, .foto2, .foto3, .foto4 {
            width: 250px;
            height: 250px;
            object-fit: cover;
            border: 3px solid #2563eb;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15);
            transition: all 0.3s ease;
        }

        .foto1:hover, .foto2:hover, .foto3:hover, .foto4:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 22px rgba(37, 99, 235, 0.28);
            border-color: #1d4ed8;
        }

        hr {
            border: 0;
            height: 1px;
            background: linear-gradient(to right, transparent, #cbd5e1, transparent);
            margin: 30px 0;
        }

        video {
            width: 100%;
            max-width: 420px;
            height: auto;
            border: 3px solid #2563eb;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            background-color: #000;
            transition: all 0.3s ease;
        }

        video:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        audio {
            display: block;
            width: 100%;
            max-width: 500px;
            min-height: 45px;
            margin: 15px auto;
            border-radius: 30px;
            outline: none;
        }
    </style>
</head>
